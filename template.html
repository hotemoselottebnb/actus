    .card p { margin: 0 0 18px; line-height: 1.5; color: #555; flex: 1; }
    .card a.button { align-self: flex-start; background: #8b1e2d; color: white; text-decoration: none; padding: 10px 14px; border-radius: 10px; font-weight: bold; }
